<!-- Main modal -->

<div
  id="select-modal"
  tabindex="-1"
  aria-hidden="true"
  [class.show-modal]="chatvisible"
  class="share-to-chatModal flex overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full"
>
  <div class="relative p-4 w-full max-w-md max-h-full">
    <!-- Modal content -->
    <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
      <!-- Modal header -->
      <div
        class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600"
      >
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
          Share {{ title }}
        </h3>
        <button
          (click)="sharetoChatModal()"
          type="button"
          class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm h-8 w-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
          data-modal-toggle="select-modal"
        >
          <svg
            class="w-3 h-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 14 14"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
            />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      @defer(when isLoading == false) {
      <!-- Modal body -->
      <div class="p-4 md:p-5">
        <p
          class="text-gray-500 dark:text-gray-400 mb-4 tex-sm text-center cursor-pointer"
          (click)="copyLink(message)"
        >
          Copy Link
          <i class="fa-regular fa-copy"></i>
        </p>
        <div class="overflow-y-scroll h-72 mb-2">
          <ul class="space-y-4 mb-4">
            @for (conversation of conversations; track conversation._id) { @if
            (conversation.isGroup) {
            <li>
              <input
                (change)="selectConverstion(conversation._id)"
                type="radio"
                [id]="conversation._id"
                name="job"
                value="job-1"
                class="hidden peer"
                required
              />
              <label
                [for]="conversation._id"
                class="inline-flex items-center justify-between w-full p-2 text-gray-900 bg-white border border-gray-200 rounded-lg cursor-pointer dark:hover:text-gray-300 dark:border-gray-500 dark:peer-checked:text-blue-500 peer-checked:border-blue-600 peer-checked:text-blue-600 hover:text-gray-900 hover:bg-gray-100 dark:text-white dark:bg-gray-600 dark:hover:bg-gray-500"
              >
                <div class="flex text-sm justify-center items-center gap-3">
                  @if (conversation.memberDetails.length>1) {
                  <div class="flex -space-x-4 rtl:space-x-reverse">
                    <img
                      class="w-10 h-10 border-2 border-white rounded-full dark:border-gray-800"
                      [src]="conversation.memberDetails[0].profileimg"
                      alt=""
                    />
                    <img
                      class="w-10 h-10 border-2 border-white rounded-full dark:border-gray-800"
                      [src]="conversation.memberDetails[1].profileimg"
                      alt=""
                    />
                    @if ((conversation.memberDetails.length-2)>0) {
                    <a
                      class="flex items-center justify-center w-10 h-10 text-xs font-medium text-white bg-gray-700 border-2 border-white rounded-full hover:bg-gray-600 dark:border-gray-800"
                      href="#"
                      >{{ conversation.memberDetails.length - 2 }}</a
                    >
                    }
                  </div>
                  }@else {
                  <img
                    [src]="conversation.memberDetails[0].profileimg"
                    class="w-10 h-10 rounded-full"
                    alt=""
                  />
                  }

                  <div class="w-full font-semibold ml-3">
                    {{ conversation.groupName }}
                  </div>
                </div>
              </label>
            </li>
            }@else {
            <li>
              <input
                (change)="selectConverstion(conversation._id)"
                type="radio"
                [id]="conversation._id"
                name="job"
                value="job-1"
                class="hidden peer"
                required
              />
              <label
                [for]="conversation._id"
                class="inline-flex items-center justify-between w-full p-2 text-gray-900 bg-white border border-gray-200 rounded-lg cursor-pointer dark:hover:text-gray-300 dark:border-gray-500 dark:peer-checked:text-blue-500 peer-checked:border-blue-600 peer-checked:text-blue-600 hover:text-gray-900 hover:bg-gray-100 dark:text-white dark:bg-gray-600 dark:hover:bg-gray-500"
              >
                <div class="flex text-sm justify-center items-center gap-2">
                  <img
                    [src]="conversation.memberDetails[0].profileimg"
                    class="w-10 h-10 rounded-full"
                    alt=""
                  />
                  <div class="w-full font-semibold">
                    {{ conversation.memberDetails[0].name }}
                  </div>
                </div>
              </label>
            </li>
            } }
          </ul>
        </div>
        <button
          (click)="onSend()"
          class="text-white inline-flex w-full justify-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
        >
          Share
        </button>
      </div>
      } @placeholder{ 
        <div class="p-4 md:p-5 text-center">
            <div role="status">
                <svg
                  aria-hidden="true"
                  class="inline w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-gray-600 dark:fill-gray-300"
                  viewBox="0 0 100 101"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                    fill="currentColor"
                  />
                  <path
                    d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                    fill="currentFill"
                  />
                </svg>
                <span class="sr-only">Loading...</span>
              </div>
        </div>
      }
    </div>
  </div>
</div>
